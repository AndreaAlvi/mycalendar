<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Calendario</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="MyCalendar">

<meta name="theme-color" content="#171717">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="top-accent"></div>
<div class="modal-backdrop" id="modalBackdrop"></div>
  
  <main class="calendar-home">
    <!-- Intestazione Mese -->
    <header class="month-navigation">
      <button type="button" class="month-button" id="prevMonthBtn" aria-label="Mese precedente">
        <img src="assets/icons/freccia_sx.svg" alt="" />
      </button>
      <h1 class="month-title" id="monthTitle">Ago 2026</h1>
      <button type="button" class="month-button" id="nextMonthBtn" aria-label="Mese successivo">
        <img src="assets/icons/freccia_dx.svg" alt="" />
      </button>
    </header>

    <!-- Griglia Calendario -->
    <section class="calendar">
      <div class="weekdays">
        <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span>
      </div>
      <ul class="calendar-grid" id="calendarGrid"></ul>

      <!-- POP-OVER EVENTO CON FRECCETTA E DESIGN FIGMA -->
      <div class="modal" id="eventModal">
        
        <div class="modal-cards-container" id="modalCardsContainer">
          <!-- Le schede dei popup verranno inserite automaticamente qui da app.js -->
        </div>
      </div>
    </section>

    <!-- Lista Prossimi Impegni -->
    <section class="upcoming">
      <h2>Prossimi impegni</h2>
      <ul class="event-list" id="upcomingEventsList"></ul>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
